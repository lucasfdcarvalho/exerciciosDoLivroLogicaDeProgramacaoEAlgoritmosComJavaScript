<meta charset="UTF-8">
<script>
    const dias = Number(prompt("N. Dias: ")); // lê os dias
    const horas = Number(prompt("N. Horas: ")); // lê as horas
    const total = horas + (dias * 24); // soma as horas com os dias convertidos em horas
    alert(`Total de Horas: ${total}`); // exibe o total
</script>
