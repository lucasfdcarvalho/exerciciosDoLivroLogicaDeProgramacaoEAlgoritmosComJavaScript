<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 6.4</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="icon" href="img/livrojs.png" type="image/png">
</head>
<body>
    <img src="img/ex6_4.jpg" alt="Brinquedoteca" class="alta">
    <h1>Programa Brinquedoteca</h1>
    <form>
        <p>Nome da Criança:
            <input type="text" id="inNome" required autofocus>
        </p>
        <p>Idade:
            <input type="number" id="inIdade" min="0" required>
            <input type="submit" value="Adicionar">
        </p>
        <p>
            <input type="button" id="btListar" value="Listar Todos">
            <input type="button" id="btResumir" value="Resumir Por Idade">
        </p>
    </form>
    <pre></pre>
    <script src="js/ex6_4.js"></script>
</body>
</html>
