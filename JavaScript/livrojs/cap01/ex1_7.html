<meta charset="UTF-8">
<script>
    const jantar = Number(prompt("Valor do Jantar R$: ")); // lê o valor do jantar
    const garcom = 0.1 * jantar; // calcula variáveis de saída
    const total = jantar + garcom; 
    alert(`Valor do Jantar R$: ${jantar}\nTaxa Garçom R$: ${garcom.toFixed(2)}\nTotal: ${total.toFixed(2)}`);
</script>
