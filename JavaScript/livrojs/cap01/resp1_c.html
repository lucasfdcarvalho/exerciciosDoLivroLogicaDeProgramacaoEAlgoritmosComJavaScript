<meta charset="UTF-8">
<script>
    const preco = prompt("Preço R$: "); // lê o preço
    const aVista = preco - (preco * 0.10); // calcula o desconto
    const valor3x = preco / 3; // calcula o valor em 3 vezes
    alert(`À Vista R$: ${aVista.toFixed(2)}\nOu 3x de R$: ${valor3x.toFixed(2)}`); // exibe o resultado
</script>
