<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 6.3</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="icon" href="img/livrojs.png" type="image/png">
</head>
<body>
    <img src="img/ex6_3.jpg" alt="Revenda Herbie" class="alta">
    <h1>Revenda Herbie</h1>
    <form>
        <p>Modelo:
            <input type="text" id="inModelo" required autofocus>
        </p>
        <p>Preço R$:
            <input type="number" id="inPreco" required>
            <input type="submit" value="Adicionar">
        </p>
        <p>
            <input type="button" id="btListar" value="Listar Todos">
            <input type="button" id="btFiltrar" value="Filtrar por Preço">
            <input type="button" id="btSimular" value="Simular Promoção">
        </p>
    </form>
    <pre></pre>
    <script src="js/ex6_3.js"></script>
</body>
</html>
