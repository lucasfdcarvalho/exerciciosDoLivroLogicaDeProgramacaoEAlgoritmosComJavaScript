<head>

    <title>Exemplo 4.1</title>
</head>
<body>
    <h1>Programa Situação do Aluno</h1>
    <form>
        <p>Nome do Aluno:
            <input type="text" id="inNome" required>
        </p>
        <p>Primeira Nota:
            <input type="number" min="0" step="0.1" id="inNota1" required>
        </p>
        <p>Segunda Nota:
            <input type="number" id="inNota2" min="0" step="0.1" required>
        </p>
        <input type="submit" value="Exibir Média e Situação">
    </form>
    <h3></h3>
    <h4></h4>

</body>
