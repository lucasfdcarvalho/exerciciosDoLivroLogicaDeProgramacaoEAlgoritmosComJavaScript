<meta charset="UTF-8">
<script>
    const conta = prompt("Valor da Conta R$: "); // lê o valor total da conta
    const clientes = prompt("Número de Clientes: "); // lê a quantidade de clientes
    const valorPorCliente = conta / clientes; // calcula a divisão do valor da conta pela quantidade de cliente
    alert(`Valor por Cliente R$: ${valorPorCliente.toFixed(2)}`); // exibe o resultado com 2 casas decimais
</script>
